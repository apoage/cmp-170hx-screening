name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax
        run: bash -n bin/hx-vram-screen.sh install.sh bench-setup/hx-install-unlock.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning bin/hx-vram-screen.sh bin/hx.in install.sh bench-setup/hx-install-unlock.sh

      - name: hx.in template substitutes cleanly
        run: |
          sed -e 's|@HERE@|/tmp/chk|g' bin/hx.in > /tmp/hx
          bash -n /tmp/hx
          grep -q '@HERE@' /tmp/hx && { echo "unsubstituted @HERE@ left"; exit 1; } || true

      - name: python compile
        run: python3 -m py_compile bin/hx-thermal-analyze.py bin/hx-dashboard.py bin/hx-tui.py bin/hx-bandwidth.py bin/cardreport.py bin/hx-vram-verdict.py

      - name: vram verdict classifier against fixtures
        # PASS / PASS-ECC (correctable delta) / PASS-MASK (errors above the
        # 40 GiB geometry floor) / FAIL (scattered) — the classification a
        # seller prices from, tested without a GPU.
        run: |
          V=bin/hx-vram-verdict.py
          F=tests/fixtures
          [ "$(python3 $V $F/memtest-clean.txt 61847529062 --rc 124 --mins 1 | head -1)" = "PASS" ]
          # frozen 90 s in: rc=124 (our limit ended it) but only 60 s recorded
          # of a 15-min window — must be INCONCLUSIVE, never PASS
          [ "$(python3 $V $F/memtest-frozen.txt 61847529062 --rc 124 --mins 15 | head -1)" = "INCONCLUSIVE" ]
          python3 $V $F/memtest-frozen.txt 61847529062 --rc 124 --mins 15 >/dev/null; rc2=$?; [ "$rc2" -eq 2 ]
          # died early, no closing line: INCONCLUSIVE
          [ "$(python3 $V $F/memtest-earlyexit.txt 61847529062 --rc 1 --mins 15 | head -1)" = "INCONCLUSIVE" ]
          [ "$(python3 $V $F/memtest-maskable.txt 61847529062 | head -1)" = "PASS-MASK" ]
          [ "$(python3 $V $F/memtest-scattered.txt 61847529062 | head -1)" = "FAIL" ]
          rc=0; python3 $V $F/memtest-scattered.txt 61847529062 >/dev/null || rc=$?
          [ "$rc" -eq 1 ]
          OUT="$(python3 $V $F/memtest-clean.txt 61847529062 --rc 124 --mins 1 \
                --pre-q $F/ecc-q.txt --post-q $F/ecc-q-post-corrected.txt)"
          echo "$OUT" | head -1 | grep -qx "PASS-ECC"
          echo "$OUT" | grep -q "fixable"
          echo "$OUT" | grep -q "usable" || true   # mask detail only on MASK runs

      - name: cardreport selftest
        # Validates the dossier analytics (defect masks -> latent VRAM/SMs)
        # against a reference card, no GPU needed.
        run: python3 bin/cardreport.py --selftest

      - name: bandwidth tool exits cleanly without a GPU
        # It must fail with a usable message, not a traceback: the most likely
        # first run is on a bench where torch is in a venv the user has not
        # named yet.
        run: |
          if python3 bin/hx-bandwidth.py > /tmp/bw.txt 2>&1; then
            echo "expected a non-zero exit with no CUDA available"; cat /tmp/bw.txt; exit 1
          fi
          cat /tmp/bw.txt
          grep -qi "torch" /tmp/bw.txt
          ! grep -qi "Traceback" /tmp/bw.txt

      - name: thermal analyzer against a recorded curve
        # Guards the one piece that can be tested without a GPU: the analyser is
        # pure CSV in, markdown out, so a fixture catches a regression in the
        # C/W maths or the verdict logic before it reaches a customer report.
        run: |
          python3 bin/hx-thermal-analyze.py tests/fixtures/telemetry-pass.csv 2 > /tmp/out.md
          cat /tmp/out.md
          grep -q "Thermal verdict:" /tmp/out.md
          grep -q "FLEET," /tmp/out.md
