name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax
        run: bash -n bin/hx-vram-screen.sh bin/hx-module-check.sh install.sh bench-setup/hx-install-unlock.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning bin/hx-vram-screen.sh bin/hx-module-check.sh bin/hx.in install.sh bench-setup/hx-install-unlock.sh

      - name: hx.in template substitutes cleanly
        run: |
          sed -e 's|@HERE@|/tmp/chk|g' bin/hx.in > /tmp/hx
          bash -n /tmp/hx
          grep -q '@HERE@' /tmp/hx && { echo "unsubstituted @HERE@ left"; exit 1; } || true

      - name: python compile
        run: python3 -m py_compile bin/hx-thermal-analyze.py bin/hx-dashboard.py bin/hx-tui.py bin/hx-bandwidth.py bin/cardreport.py bin/hx-vram-verdict.py

      - name: vram verdict classifier against fixtures
        # PASS / PASS-ECC (correctable delta) / PASS-MASK (errors above the
        # 40 GiB geometry floor) / FAIL (scattered) — the classification a
        # seller prices from, tested without a GPU.
        run: |
          V=bin/hx-vram-verdict.py
          F=tests/fixtures
          [ "$(python3 $V $F/memtest-clean.txt 61847529062 --rc 124 --mins 1 | head -1)" = "PASS" ]
          # frozen 90 s in: rc=124 (our limit ended it) but only 60 s recorded
          # of a 15-min window — must be INCONCLUSIVE, never PASS
          [ "$(python3 $V $F/memtest-frozen.txt 61847529062 --rc 124 --mins 15 | head -1)" = "INCONCLUSIVE" ]
          rc2=0; python3 $V $F/memtest-frozen.txt 61847529062 --rc 124 --mins 15 >/dev/null || rc2=$?
          [ "$rc2" -eq 2 ]
          # died early, no closing line: INCONCLUSIVE
          [ "$(python3 $V $F/memtest-earlyexit.txt 61847529062 --rc 1 --mins 15 | head -1)" = "INCONCLUSIVE" ]
          # 1-minute window, frozen before the first report (zero recorded):
          # the 30 s floor must keep this INCONCLUSIVE, not PASS
          printf "memtest_vulkan v0.5.0\nTest buffer size: 1073741824 bytes\n" > /tmp/zero.txt
          [ "$(python3 $V /tmp/zero.txt $((1<<30)) --rc 124 --mins 1 | head -1)" = "INCONCLUSIVE" ]
          [ "$(python3 $V $F/memtest-maskable.txt 61847529062 | head -1)" = "MASK-CANDIDATE" ]
          rc3=0; python3 $V $F/memtest-maskable.txt 61847529062 >/dev/null || rc3=$?
          [ "$rc3" -eq 1 ]
          # unparsed error markers can never pass (regression: backstop)
          [ "$(python3 $V $F/memtest-unparsed.txt 61847529062 --rc 124 --mins 1 | head -1)" = "FAIL" ]
          rc4=0; python3 $V $F/memtest-unparsed.txt 61847529062 --rc 124 --mins 1 >/dev/null || rc4=$?
          [ "$rc4" -eq 1 ]
          [ "$(python3 $V $F/memtest-scattered.txt 61847529062 | head -1)" = "FAIL" ]
          rc=0; python3 $V $F/memtest-scattered.txt 61847529062 >/dev/null || rc=$?
          [ "$rc" -eq 1 ]
          OUT="$(python3 $V $F/memtest-clean.txt 61847529062 --rc 124 --mins 1 \
                --pre-q $F/ecc-q.txt --post-q $F/ecc-q-post-corrected.txt)"
          echo "$OUT" | head -1 | grep -qx "PASS-ECC"
          echo "$OUT" | grep -q "disclosed as a finding"
          # real captured bench output (no version banner, real interval format)
          # with real N/A ECC counters on both sides -> PASS, counters "not readable"
          [ "$(python3 $V $F/memtest-real-clean.txt $((1<<30)) --rc 124 --mins 2 | head -1)" = "PASS" ]
          OUTNA="$(python3 $V $F/memtest-real-clean.txt $((1<<30)) --rc 124 --mins 2 \
                   --pre-q $F/ecc-q-real-na.txt --post-q $F/ecc-q-real-na.txt)"
          echo "$OUTNA" | head -1 | grep -qx "PASS"
          echo "$OUTNA" | grep -q "not readable"
          echo "$OUT" | grep -q "usable" || true   # mask detail only on MASK runs

      - name: kernel-line attribution and fatal-Xid extraction
        # Real Xid lines carry PCI:0000:05:00 (bus:device, no .function);
        # the code follows the closing paren, not the address digits.
        run: |
          BUSID="00000000:05:00.0"
          PCI_TAG="$(echo "$BUSID" | sed 's/^00000000:/0000:/' | cut -d. -f1)"
          [ "$PCI_TAG" = "0000:05:00" ]
          HIT="$(grep -iE "xid|nvrm|pcie bus error" tests/fixtures/dmesg-xid.txt \
                | grep -F -e "$PCI_TAG" -e "__none__")"
          echo "$HIT"
          echo "$HIT" | grep -q "): 79"
          ! (echo "$HIT" | grep -q "0000:03:00")     # other card must not match
          CODES="$(echo "$HIT" | grep -oE 'Xid \(PCI:[^)]*\): [0-9]+' | grep -oE '[0-9]+$' | sort -u | tr '\n' ' ')"
          [ "$CODES" = "79 " ]

      - name: module provenance guard against fake modules
        # clean module must read "ok" (grep -c exits 1 on zero matches — a
        # past bug made every clean module read "not checked"); marked
        # modules must abort with exit 3, plain and compressed; an unreadable
        # module must read "not checked".
        run: |
          G=bin/hx-module-check.sh
          printf 'NVRM benign SEC2_DEBUG_HEAP line\n' > /tmp/clean.ko
          printf 'NVRM SEC2_DEBUG: HS fusegate marker\n' > /tmp/marked.ko
          gzip -c /tmp/clean.ko  > /tmp/clean.ko.gz
          gzip -c /tmp/marked.ko > /tmp/marked.ko.gz
          bash "$G" /tmp/clean.ko    | grep -q "provenance: ok"
          bash "$G" /tmp/clean.ko.gz | grep -q "provenance: ok"
          rc=0; bash "$G" /tmp/marked.ko    >/dev/null 2>&1 || rc=$?; [ "$rc" -eq 3 ]
          rc=0; bash "$G" /tmp/marked.ko.gz >/dev/null 2>&1 || rc=$?; [ "$rc" -eq 3 ]
          bash "$G" /tmp/nonexistent.ko.zst | grep -q "not checked"

      - name: cardreport selftest
        # Validates the dossier analytics (defect masks -> latent VRAM/SMs)
        # against a reference card, no GPU needed.
        run: python3 bin/cardreport.py --selftest

      - name: bandwidth tool exits cleanly without a GPU
        # It must fail with a usable message, not a traceback: the most likely
        # first run is on a bench where torch is in a venv the user has not
        # named yet.
        run: |
          if python3 bin/hx-bandwidth.py > /tmp/bw.txt 2>&1; then
            echo "expected a non-zero exit with no CUDA available"; cat /tmp/bw.txt; exit 1
          fi
          cat /tmp/bw.txt
          grep -qi "torch" /tmp/bw.txt
          ! grep -qi "Traceback" /tmp/bw.txt

      - name: thermal analyzer against a recorded curve
        # Guards the one piece that can be tested without a GPU: the analyser is
        # pure CSV in, markdown out, so a fixture catches a regression in the
        # C/W maths or the verdict logic before it reaches a customer report.
        run: |
          python3 bin/hx-thermal-analyze.py tests/fixtures/telemetry-pass.csv 2 > /tmp/out.md
          cat /tmp/out.md
          grep -q "Thermal verdict:" /tmp/out.md
          grep -q "FLEET," /tmp/out.md
